[project]
name = "halcyon"
version = "0.1.0"
schema = "deal/0.1"
marking = "Unclassified"
description = "HALCYON 6U Earth-observation CubeSat — DEAL language showcase #2 (full-construct coverage + deal-view translation source)"

[workspace]
# CORE packages only. packages/behaviors is FRONTIER (state machines,
# activity flows — written to locked BH-1..BH-7 designs ahead of grammar
# landing) and is deliberately excluded from the default check set so the
# core model stays `deal check`-clean. Check it explicitly with:
#   deal parse packages/behaviors
packages = [
    "packages/interfaces",
    "packages/spacecraft",
    "packages/requirements",
    "packages/use-cases",
    "packages/analysis",
]

# Frontier/draft packages excluded from `deal check` directory expansion: they
# are written to the locked BH-1..BH-7 behavior designs ahead of the grammar
# and intentionally do not parse on today's CLI. Check them explicitly with
# `deal parse packages/behaviors/*.deal` to see the expected diagnostics.
exclude = [
    "packages/behaviors",
]

[workspace.aliases]
spacecraft = "packages/spacecraft"
interfaces = "packages/interfaces"
reqs       = "packages/requirements"
use_cases  = "packages/use-cases"
analysis   = "packages/analysis"

# Path dependency on the in-repo deal-stdlib (D-66, referenced in place).
# Production dependency on the DEAL standard library (ADR-0004 P6). `deal install`
# vendors it into `.deal/deps/deal-stdlib/`, where the compiler and LSP resolve
# it (closure loader reads `.deal/deps/*/packages`). `.deal/` is gitignored, so
# CI runs `deal install` before checking the examples. Git deps are location-
# independent, unlike the former relative path dep which broke across the
# top-level `spec/` and `deal/spec` submodule checkouts (different depth).
[dependencies]
deal-stdlib = { git = "https://github.com/deal-lang/deal-stdlib", tag = "v0.4.1" }

[simulations]
registry = "simulations/deal.sims.toml"
cache_dir = ".deal/simulations"

[views]
# Workspace theme — type-level defaults applied to every view (GV-9).
theme = "model/global.dealview"

# Co-located views (auto-discovered: <name>.dealview beside <name>.dealx):
#   model/halcyon.dealview, model/traceability.dealview.
#
# Cross-cutting views — membership drawn from multiple files. `source` is also
# the insertion target for new model content created by editing through a view.
structure-bdd    = { source = "packages/spacecraft/index.deal",     view = "model/views/structure-bdd.dealview" }
power-ibd        = { source = "model/halcyon.dealx",                view = "model/views/power-ibd.dealview" }
data-ibd         = { source = "model/halcyon.dealx",                view = "model/views/data-ibd.dealview" }
icd              = { source = "model/halcyon.dealx",                view = "model/views/icd.dealview" }
variants         = { source = "model/variants/multispec.dealx",     view = "model/views/variants.dealview" }
full-system      = { source = "model/halcyon.dealx",                view = "model/views/full-system.dealview" }
# Frontier behavior views — sources don't parse on today's grammar (BH):
modes-fsm        = { source = "packages/behaviors/modes.deal",      view = "model/views/modes-fsm.dealview" }
imaging-activity = { source = "packages/behaviors/activities.deal", view = "model/views/imaging-activity.dealview" }

[build.targets]
sysml-v2 = { format = "json", output = "build/sysml-v2/" }
reqif = { format = "xml", output = "build/reqif/" }
docs = { format = "html", output = "build/docs/", template = "program-review" }
